<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Moji</title>
  <!-- El splash pinta antes de que exista un token: su fondo es el BG de main.cjs. -->
  <style>
    #boot-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0a0a0a; color: #f0f3f7; font: 500 17px 'Segoe UI', sans-serif; }
    #boot-splash[data-state=closing] { opacity: 0; transition: opacity 180ms; }
  </style>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/moji.css">
</head>
<body>
  <div id="boot-splash">Moji</div>

  <header class="titlebar">
    <div class="brand"><i data-icon="moji-face"></i><span>Moji</span></div>
    <button id="settings" class="icon-button" aria-label="Ajustes" data-tip="Ajustes"><i data-icon="moji-settings"></i></button>
    <button id="close" class="icon-button" aria-label="Ocultar Moji" data-tip="Ocultar" data-tip-key="Esc"><i data-icon="moji-close"></i></button>
  </header>

  <!-- ── El panel ───────────────────────────────────────────────────────── -->
  <main id="panel" class="is-settled">
    <nav id="tabs" role="tablist" aria-label="Tipo de carácter"></nav>

    <div class="search-wrap">
      <i data-icon="moji-search"></i>
      <input id="search" type="search" placeholder="Buscá: corazón, pulgar, mate…" aria-label="Buscar caracteres" autocomplete="off" spellcheck="false">
      <span class="search-end">
        <button id="clear-search" class="icon-button is-off" aria-label="Borrar búsqueda"><i data-icon="moji-close"></i></button>
        <kbd id="search-key">/</kbd>
      </span>
    </div>

    <div id="categories" class="categories is-start is-end" aria-label="Categorías"></div>

    <div class="section-label"><span id="section-name">Para empezar</span><span id="result-count"></span></div>
    <div id="results" class="results op-scroll op-scroll--line-bottom" role="tabpanel" aria-label="Caracteres disponibles" tabindex="-1"></div>

    <footer class="preview">
      <span id="preview-char" class="preview-char"></span>
      <div class="preview-info">
        <span id="preview-label"></span>
        <span id="preview-hint">Clic para insertar · clic derecho para copiar</span>
      </div>
      <button id="tone" class="tone-control" aria-label="Tono de piel" data-tip="Tono de piel"><span class="tone-dot"></span></button>
    </footer>
  </main>

  <!-- ── Ajustes ────────────────────────────────────────────────────────── -->
  <section id="preferences" class="is-settled" hidden aria-label="Ajustes">
    <div class="preferences-head">
      <button id="back" class="icon-button" aria-label="Volver"><i data-icon="moji-back"></i></button>
      <h1>Ajustes</h1>
    </div>

    <div class="setting-card">
      <label for="shortcut">Abrir desde cualquier app</label>
      <p>Hacé clic y presioná tu combinación.</p>
      <input id="shortcut" readonly aria-label="Grabar atajo de teclado">
      <span id="shortcut-status" role="status"></span>
    </div>

    <div class="setting-card setting-row">
      <div>
        <label for="startup">Iniciar con Windows</label>
        <p>Arranca oculto en la bandeja.</p>
      </div>
      <button id="startup" role="switch" aria-checked="false" class="switch" aria-label="Iniciar con Windows"><span></span></button>
    </div>

    <div class="setting-card setting-row">
      <div>
        <label>Actualizaciones</label>
        <p id="update-status" role="status">Se buscan solas al abrir Moji.</p>
      </div>
      <button id="update-action" class="op-btn op-btn--secondary op-swap--row"><i data-icon="retry"></i><span>Buscar</span></button>
    </div>

    <div class="setting-card setting-row">
      <div>
        <label>Más usados</label>
        <p>Ordenados por cantidad de usos.</p>
      </div>
      <button id="reset-usage" class="op-btn op-btn--secondary" aria-label="Reiniciar más usados"><i data-icon="undo"></i><span>Reiniciar</span></button>
    </div>

    <div class="about">
      <i data-icon="moji-mark"></i><span>Moji <small id="version"></small></span>
      <p>Hecho con Opal.</p>
      <button id="quit" class="op-btn op-btn--secondary"><i data-icon="moji-power"></i><span>Salir de Moji</span></button>
    </div>
  </section>

  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div id="op-layer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
